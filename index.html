<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Janet — Security Crash Course</title>
    <meta name="description" content="Learn the security basics through short interactive chats with Janet." />
    <meta name="theme-color" content="#f6e0d2" />
    <link rel="icon" href="janet.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Home">
        <span class="brand-avatar" aria-hidden="true">J</span>
        <span class="brand-name">Janet</span>
      </a>
      <div class="topbar-right">
        <div class="karma" title="Karma points">
          <span aria-hidden="true">✨</span>
          <span id="karma-count">0</span>
        </div>
        <select id="lang-select" class="lang-select" aria-label="Language">
          <option value="en">EN — English</option>
          <option value="fr">FR — Français</option>
          <option value="es">ES — Español</option>
          <option value="de">DE — Deutsch</option>
          <option value="it">IT — Italiano</option>
          <option value="da">DA — Dansk</option>
          <option value="bg">BG — Български</option>
          <option value="tr">TR — Türkçe</option>
        </select>
        <button id="reset-btn" type="button" class="reset" title="Reset progress">⟲</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <template id="tpl-home">
      <section class="home">
        <div class="hero">
          <div class="hero-avatar" aria-hidden="true">J</div>
          <h1 data-i18n="home.title">Hi there! I'm Janet.</h1>
          <p data-i18n="home.subtitle">Pick a course, friend. Each one is just a few minutes — and I promise no homework.</p>
          <a class="hero-link" href="#/about" data-i18n="home.aboutLink">Who is Janet?</a>
        </div>
        <div id="course-grid" class="course-grid"></div>
        <footer class="home-footer">
          <a href="https://github.com/immortal-tofu/janet" target="_blank" rel="noopener" aria-label="GitHub repository">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
              <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.92.58.11.78-.25.78-.55v-1.93c-3.19.69-3.86-1.54-3.86-1.54-.52-1.33-1.27-1.68-1.27-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.73-1.53-2.55-.29-5.23-1.27-5.23-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.17.91-.25 1.89-.38 2.86-.38.97 0 1.95.13 2.86.38 2.19-1.48 3.15-1.17 3.15-1.17.62 1.58.23 2.75.11 3.04.74.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.37-5.25 5.65.41.36.78 1.05.78 2.12v3.14c0 .3.2.66.79.55C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z" />
            </svg>
            <span>immortal-tofu/janet</span>
          </a>
          <a href="https://x.com/immortofu" target="_blank" rel="noopener" aria-label="X / Twitter profile">
            <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z" />
            </svg>
            <span>@immortofu</span>
          </a>
        </footer>
      </section>
    </template>

    <template id="tpl-about">
      <section class="about">
        <div class="about-topbar">
          <button class="back-btn" type="button" data-action="back" aria-label="Back">←</button>
        </div>
        <div class="about-avatar" aria-hidden="true"></div>
        <h1 data-i18n="about.title">Who is Janet?</h1>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
        <p data-i18n="about.p3"></p>
        <p class="about-footnote" data-i18n="about.p4"></p>
      </section>
    </template>

    <template id="tpl-course">
      <section class="chat">
        <div class="chat-header">
          <button class="back-btn" type="button" aria-label="Back" data-action="back">←</button>
          <div class="chat-title">
            <div class="chat-avatar" aria-hidden="true"></div>
            <div class="chat-name">
              <span id="chat-name">Janet</span>
              <span class="chat-status">
                <span id="chat-emoji" class="chat-emoji">✨</span>
                <span id="chat-status-text">online</span>
              </span>
            </div>
          </div>
          <div class="chat-spacer"></div>
        </div>
        <div id="messages" class="messages" role="log" aria-live="polite"></div>
        <div id="choices" class="choices"></div>
      </section>
    </template>

    <script src="js/i18n.js"></script>
    <script src="js/courses/index.js"></script>
    <script src="js/courses/company_documents.js"></script>
    <script src="js/courses/passwords.js"></script>
    <script src="js/courses/two_factor.js"></script>
    <script src="js/courses/phishing.js"></script>
    <script src="js/courses/spear_phishing.js"></script>
    <script src="js/courses/ceo_fraud.js"></script>
    <script src="js/courses/malware.js"></script>
    <script src="js/courses/data_breaches.js"></script>
    <script src="js/courses/personal_data.js"></script>
    <script src="js/courses/smishing.js"></script>
    <script src="js/courses/ransomware.js"></script>
    <script src="js/courses/digital_footprint.js"></script>
    <script src="js/courses/linkedin_footprint.js"></script>
    <script src="js/courses/ai_slop.js"></script>
    <script src="js/courses/tailgating.js"></script>
    <script src="js/courses/mobile_phone.js"></script>
    <script src="js/courses/on_vacation.js"></script>
    <script src="js/courses/software_vulnerabilities.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
